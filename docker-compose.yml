services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: anova-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  anova-nano-bridge:
    build: .
    # or: image: ghcr.io/guykh/anova-nano-to-mqtt:latest
    container_name: anova-nano-bridge
    depends_on:
      - mqtt-broker
    environment:
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1883"
      MQTT_USER: ""
      MQTT_PASSWORD: ""
      MQTT_TOPIC_PREFIX: anova/nano
      # DEVICE_ADDRESS: "AA:BB:CC:DD:EE:FF"   # recommended once you know it
      SCAN_TIMEOUT: "10"
      POLL_INTERVAL: "30"
      HA_DISCOVERY: "true"
      LOG_LEVEL: INFO
    security_opt:
      - apparmor:unconfined
    volumes:
      # bleak uses the host's BlueZ over the system D-Bus.
      - /var/run/dbus:/var/run/dbus
    restart: unless-stopped
