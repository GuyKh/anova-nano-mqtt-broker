version: "3.8"

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: anova-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  anova-nano-bridge:
    build: .
    container_name: anova-nano-bridge
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - ANVA_SCAN_TIMEOUT=5
    restart: unless-stopped
    # Bluetooth access for BLE - add host's Bluetooth group to container
    group_add:
      - bluetooth
    # Alternative options if group_add doesn't work on your system:
    # privileged: true  # Less secure, not recommended
    # devices:
    #   - "/dev/rfcomm0:/dev/rfcomm0"  # Direct device access
    #   - "/var/run/dbus:/var/run/dbus"  # DBus access for BlueZ