# Mosquitto 2.x config for anova-nano-to-mqtt.
listener 1883 0.0.0.0

# Anonymous access is convenient on a trusted LAN. For anything else, set
# allow_anonymous false and configure password_file (see mosquitto_passwd).
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
