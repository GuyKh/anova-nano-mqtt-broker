# Mosquitto MQTT Broker Configuration for anova-nano-to-mqtt

# Listen on all interfaces
listener 1883

# Set port
port 1883

# Bind to all interfaces
bind_address 0.0.0.0

# Enable anonymous access (no password required)
allow_anonymous true

# Log destinations
log_type all
log_output file

# Log file
log_file /mosquitto/log/mosquitto.log

# PID file
pid_file /mosquitto/log/mosquitto.pid

# Maximum packet size
max_packet_size 1048576

# Connection rate limiting
max_connections 100