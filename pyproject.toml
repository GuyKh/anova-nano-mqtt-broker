[project]
name = "anova-nano-to-mqtt"
version = "0.2.0"
description = "Bridge an Anova Nano sous vide cooker (BLE) to MQTT, with Home Assistant discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyanova-nano>=0.3.5,<0.4",
    "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
anova-nano-to-mqtt = "anova_mqtt_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["anova_mqtt_service.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
